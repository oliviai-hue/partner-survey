<title>파트너 설문 ③ 정기 방문</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: chat thread (bot bubbles left, my answers right) + sticky reply tray at bottom; slim header with coffee meter */
:root{
  --bg:#bacee0; --surface:#ffffff; --fg:#1e1e1e; --muted:#5d6a75; --line:#d7dde3; --mine:#fee500; --ink:#3a2f00;
  --tray:#ffffff; --chip:#f3f4f6; --chip-on:#fff3a6; --pick-line:#e0c200; --good:#1f9d63; --err:#d9480f; --card:#fffdf2;
  --display:"Jua","Noto Sans KR",sans-serif;
  --font:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f262d; --surface:#2c333b; --fg:#eef1f4; --muted:#9aa6b2; --line:#3a434d; --tray:#252c33; --chip:#323a43; --chip-on:#4a4416; --card:#2a2a20; --good:#4cd08f; --err:#ff8a5b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f262d; --surface:#2c333b; --fg:#eef1f4; --muted:#9aa6b2; --line:#3a434d; --tray:#252c33; --chip:#323a43; --chip-on:#4a4416; --card:#2a2a20; --good:#4cd08f; --err:#ff8a5b; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pick-line);outline-offset:2px}
.gut{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.inner{max-width:560px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid rgba(0,0,0,.06)}
.top .inner{display:flex;align-items:center;gap:12px;padding-block:10px}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:15px}
.top .ttl small{color:var(--muted);font-size:12px}
.meter{display:flex;align-items:center;gap:8px}
.meter .bar{width:84px;height:8px;border-radius:4px;background:rgba(0,0,0,.12);overflow:hidden}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,#8a5a34,#5a3418);width:0;transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.meter span{font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.cups{position:relative;display:block;background:#fff;border-radius:10px;overflow:hidden;aspect-ratio:520/467;max-width:100%}
.cups img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cups .empty{filter:grayscale(1) brightness(1.25) contrast(.5);opacity:.4}
.cups .full{transition:clip-path .7s cubic-bezier(.3,1.4,.5,1)}
.mini-cup{width:46px;flex:none}

/* thread */
.thread{display:flex;flex-direction:column;gap:10px;padding-block:16px 24px}
.day{align-self:center;font-size:12px;color:var(--muted);background:rgba(0,0,0,.08);border-radius:999px;padding:3px 12px}
.row{display:flex;gap:8px;align-items:flex-start;max-width:100%;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.row.me{justify-content:flex-end}
.ava{width:40px;height:40px;border-radius:14px;overflow:hidden;background:#fff;flex:none}
.ava img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.col{display:grid;gap:4px;min-width:0;max-width:78%}
.name{font-size:12px;color:var(--muted)}
.bub{background:var(--surface);border-radius:4px 16px 16px 16px;padding:9px 13px;word-break:keep-all;overflow-wrap:anywhere}
.bub.q{font-weight:700}
.bub .hint{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:4px}
.me .bub{background:var(--mine);color:var(--ink);border-radius:16px 4px 16px 16px}
.me .bub ul{margin:0;padding-left:18px}
.me .col{justify-items:end}
.edit{font-size:11px;color:var(--muted);background:none;border:0;padding:0 2px;text-decoration:underline}
.sticker{width:130px;border-radius:16px;background:#fff;display:block}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.intro-card{background:var(--surface);border-radius:4px 16px 16px 16px;overflow:hidden;display:grid}
.intro-card .cups{border-radius:0}
.intro-card div.t{padding:10px 13px 12px;display:grid;gap:4px}
.intro-card b{font-family:var(--display);font-weight:400;font-size:18px}
.intro-card small{color:var(--muted);font-size:12px}

#app{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
#app > .gut{flex:1}
.tray:has(.inner:empty){display:none}
/* reply tray */
.tray{position:sticky;bottom:0;z-index:6;background:var(--tray);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom,0px)}
.tray .inner{display:grid;gap:8px;padding-block:12px 14px}
.tray .lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.chips{display:grid;gap:7px;max-height:44vh;overflow-y:auto;padding:2px}
.chip{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid transparent;background:var(--chip);border-radius:14px;padding:10px 12px;transition:background .15s,border-color .15s,transform .1s}
.chip:hover{border-color:var(--pick-line)}
.chip:active{transform:scale(.98)}
.chip .box{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--ink)}
.chip.radio .box{border-radius:50%}
.chip.on{background:var(--chip-on);border-color:var(--pick-line)}
.chip.on .box{background:var(--mine);border-color:var(--pick-line)}
.chip.dis{opacity:.4;cursor:not-allowed}
.chip span{min-width:0}
input[type=text],textarea{font:inherit;color:var(--fg);background:var(--chip);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
.acts{display:flex;gap:8px}
.send{flex:1;border:0;border-radius:12px;padding:12px;background:var(--mine);color:var(--ink);font-family:var(--display);font-size:18px}
.send:disabled{opacity:.45;cursor:not-allowed}
.skip{border:0;background:var(--chip);border-radius:12px;padding:12px 14px;font-size:14px}
.err{color:var(--err);font-size:12px;margin:0;font-weight:700}
.start{border:0;border-radius:14px;padding:14px;background:var(--mine);color:var(--ink);font-family:var(--display);font-size:20px}

/* toast & fx */
.fly{position:fixed;font-family:var(--display);color:var(--good);font-size:20px;pointer-events:none;z-index:20;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translateY(-50px);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}

/* finale */
.final{display:grid;gap:14px;text-align:center;justify-items:center;padding-block:28px 48px}
.final h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
.final p{margin:0;color:var(--muted)}
.ticket{position:relative;width:min(100%,360px);aspect-ratio:360/300;border-radius:18px;overflow:hidden;border:3px solid var(--pick-line);background:var(--surface);box-shadow:0 8px 20px rgba(0,0,0,.12);touch-action:none}
.prize{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;padding:16px;background:radial-gradient(circle at 50% 30%,var(--chip-on),var(--surface))}
.prize .win{font-family:var(--display);font-size:16px;letter-spacing:.3em;color:var(--good)}
.prize .nm{font-family:var(--display);font-size:22px}
.prize-img{width:150px;border-radius:12px;background:#fff}
canvas.scr{position:absolute;inset:0;width:100%;height:100%;cursor:grab;transition:opacity .6s}
.after{display:grid;gap:6px;max-width:420px;justify-items:center}
.after b{color:var(--fg)}
.ghost{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline}
.bounce{animation:bounce 1.8s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const PRIZE = '아이스 아메리카노 2잔';
const BOT = '카카오톡 예약하기';
const $ = (s, el=document) => el.querySelector(s);
const h = (tag, attrs={}, ...kids) => { const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs||{})){ if(v==null||v===false) continue; if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v===true?'':v);} kids.flat().forEach(k=>k!=null&&e.append(k)); return e; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r=>setTimeout(r, reduce?0:ms));
const partner = (location.hash||'').replace('#','').trim();
const Q = SURVEY.questions, N = Q.length;
const ans = Q.map(()=>({choices:[], etc:'', followup:'', followupDetails:{}, text:'', done:false}));
let cur = -1, startedAt = 0, busy = false, runId = 0;

function cup(level, cls){
  const top = level<=0 ? 100 : Math.max(0, 86 - level*72);
  return `<div class="cups ${cls}" role="img" aria-label="아이스 아메리카노 2잔, ${Math.round(level*100)}% 채워짐"><img src="${IMG}" class="empty" alt=""><img src="${IMG}" class="full" alt="" style="clip-path:inset(${top}% 0 0 0)"></div>`;
}

/* reactions: neutral and warm, never judging the answer */
function react(qi){
  const a = ans[qi], q = Q[qi];
  if(q.type==='text') return a.text.trim() ? '자세히 적어주셔서 정말 고마워요. 꼭 꼼꼼히 읽어볼게요!' : '괜찮아요! 여기까지 답해주신 것만으로도 큰 도움이 돼요.';
  const t = a.choices.join(' ');
  if(/없었음|없음|않았음|필요하지 않음|지장은 없었음/.test(t) && a.choices.length===1) return '다행이에요! 계속 편하게 쓰실 수 있도록 할게요.';
  if(/어려|오류|느리|복잡|반영되지|지장|완료하지 못|도움을 받기|불편/.test(t)) return '불편을 겪으셨군요. 알려주셔서 고마워요, 개선 과제로 꼭 챙길게요.';
  if(/몰랐음|모르겠음/.test(t)) return '그럴 수 있어요. 더 잘 보이게 안내하는 방법을 고민해볼게요.';
  if(/시즌|휴업|여력|인력|바빠|바쁘|미루/.test(t)) return '운영하시느라 정말 바쁘시죠. 사정 알려주셔서 고마워요.';
  return ['그렇군요, 잘 알겠어요!','알려주셔서 고마워요!','좋아요, 기록해둘게요.','이해했어요. 다음 질문이에요!'][qi%4];
}

/* ---------- layout ---------- */
const app = $('#app');
const header = h('header',{class:'top gut'}, h('div',{class:'inner'},
  h('div',{class:'ttl'}, h('b',{}, BOT), h('small',{}, '사장님의 이야기를 듣고 있어요')),
  h('div',{class:'meter'}, h('div',{class:'bar'}, h('i',{id:'bar'})), h('span',{id:'pct'}, '0%'))));
const thread = h('main',{class:'thread inner', 'aria-live':'polite'});
const trayInner = h('div',{class:'inner'});
const tray = h('footer',{class:'tray gut'}, trayInner);
app.append(header, h('div',{class:'gut'}, thread), tray);

function updMeter(){
  const done = ans.filter(a=>a.done).length, lv = done/N;
  $('#bar').style.width = (lv*100)+'%';
  $('#pct').textContent = Math.round(lv*100)+'%';
}
function scrollEnd(){ requestAnimationFrame(()=>{ const conversation=document.querySelector('#app > div.gut'); if(conversation) conversation.scrollTo({top:conversation.scrollHeight, behavior:reduce?'auto':'smooth'}); }); }
addEventListener('resize',scrollEnd);

function botRow(...content){
  return h('div',{class:'row'}, h('div',{class:'ava'}, h('img',{src:EMO.party, alt:''})), h('div',{class:'col'}, h('span',{class:'name'}, BOT), ...content));
}
async function say(content, {delay=650}={}, id=runId){
  const typing = botRow(h('div',{class:'bub typing', 'aria-label':'입력 중'}, h('i'),h('i'),h('i')));
  thread.append(typing); scrollEnd();
  await wait(delay);
  typing.remove();
  if(id!==runId) return false;
  const node = typeof content==='string' ? h('div',{class:'bub'}, content) : content;
  thread.append(botRow(node)); scrollEnd();
  return true;
}
function questionBubble(q, i){
  return h('div',{class:'bub q'}, `Q${i+1}. ${q.title}`, h('span',{class:'hint'}, q.hint || (q.type==='text' ? '선택 응답이에요. 건너뛰어도 괜찮아요.' : (q.max===1 ? '1개만 골라주세요' : `최대 ${q.max}개까지 고를 수 있어요`))));
}
function myRow(i){
  const a=ans[i], q=Q[i];
  let body;
  if(q.type==='text') body = h('div',{class:'bub'}, a.text.trim() || '(건너뛰기)');
  else {
    const items = a.choices.map(c=> c==='기타' ? `기타: ${a.etc.trim()}` : (followupAnswer(q,a,c) ? `${c}: ${followupAnswer(q,a,c)}` : c));
    body = items.length===1 ? h('div',{class:'bub'}, items[0]) : h('div',{class:'bub'}, h('ul',{}, items.map(t=>h('li',{},t))));
  }
  const edit = h('button',{class:'edit', type:'button', onclick:()=>rewind(i)}, '답변 수정');
  return h('div',{class:'row me'}, h('div',{class:'col'}, body, edit));
}

/* ---------- flow ---------- */
async function intro(){
  thread.append(h('div',{class:'day'}, '오늘'));
  const id = runId;
  await say('안녕하세요, 사장님! 카카오톡 예약하기예요 👋', {delay:500}, id);
  await say(h('img',{src:EMO.duet, class:'sticker', alt:'인사하는 이모티콘'}), {delay:500}, id);
  await say('상품 운영 상황과 파트너센터 이용 경험을 여쭤보려고 해요. 응답은 서비스 개선에만 활용돼요.', {delay:700}, id);
  await say(h('div',{class:'intro-card'}, h('div',{class:'t'}, h('b',{}, `질문 ${N}개 · 약 2분`), h('small',{}, '설문을 마치면 행운의 복권을 긁을 수 있어요. 어떤 선물이 숨어 있을지는 마지막에 확인해 보세요 🎁'))), {delay:800}, id);
  trayInner.innerHTML='';
  trayInner.append(h('button',{class:'start', type:'button', onclick:startSurvey}, '좋아요, 시작할게요 ☕'));
  scrollEnd();
}

async function ask(i){
  cur = i; const id = ++runId;
  trayInner.innerHTML='';
  if(i===0 && !thread.querySelector('.me')) thread.append(h('div',{class:'row me'}, h('div',{class:'col'}, h('div',{class:'bub'}, '좋아요, 시작할게요 ☕'))));
  const ok = await say(questionBubble(Q[i], i), {delay:700}, id);
  if(!ok) return;
  renderTray(i);
}

function followupFields(q){ return [q.followup, ...(q.followups || [])].filter(Boolean); }
function followupValue(q,a,field){ return field===q.followup ? (a.followup || '') : (a.followupDetails?.[field.option] || ''); }
function followupAnswer(q,a,option){ const field=followupFields(q).find(f=>f.option===option); return field ? followupValue(q,a,field).trim() : ''; }

function renderTray(i){
  const q=Q[i], a=ans[i];
  trayInner.innerHTML='';
  const err = h('p',{class:'err', hidden:true});
  if(q.type==='text'){
    const ta = h('textarea',{id:`q${i}-text`, placeholder:q.placeholder||''}); ta.value=a.text;
    const send = h('button',{class:'send', type:'button', onclick:()=>{ a.text=ta.value; submit(i); }}, '보내기');
    const skip = h('button',{class:'skip', type:'button', onclick:()=>{ a.text=''; submit(i); }}, '건너뛰기');
    trayInner.append(h('div',{class:'lbl'}, h('span',{}, '자유롭게 적어주세요')), ta, h('div',{class:'acts'}, skip, send));
    return;
  }
  const all = q.etc ? [...q.options,'기타'] : q.options;
  const multi = q.max>1;
  const counter = h('span',{});
  const chips = h('div',{class:'chips', role: multi?'group':'radiogroup'});
  let etc = null;
  const followupControls = [];
  const send = h('button',{class:'send', type:'button'}, '보내기');
  const sync = ()=>{
    const full = multi && a.choices.length>=q.max;
    chips.querySelectorAll('.chip').forEach(c=>{ const on=a.choices.includes(c.dataset.v); c.classList.toggle('on',on); c.setAttribute('aria-checked',on); c.querySelector('.box').textContent=on?'✓':''; const d=full&&!on; c.classList.toggle('dis',d); c.disabled=d; });
    counter.textContent = multi ? `${a.choices.length}개 선택` : '';
    if(etc) etc.hidden = !a.choices.includes('기타');
    followupControls.forEach(({field,wrap})=>{ wrap.hidden = !a.choices.includes(field.option); });
    send.disabled = !a.choices.length;
  };
  all.forEach(label=>{
    const c = h('button',{type:'button', class:'chip'+(multi?'':' radio'), role:multi?'checkbox':'radio', 'data-v':label}, h('span',{class:'box'}), h('span',{}, label==='기타' ? (q.etcLabel || label) : label));
    c.addEventListener('click',()=>{
      if(!multi){ a.choices=[label]; sync(); if(label!=='기타'){ setTimeout(()=>submit(i), reduce?0:220); } else etc?.focus(); return; }
      if(a.choices.includes(label)) a.choices=a.choices.filter(x=>x!==label);
      else if(q.exclusive?.includes(label)) a.choices=[label];
      else { a.choices=a.choices.filter(x=>!q.exclusive?.includes(x)); if(a.choices.length<q.max) a.choices.push(label); }
      err.hidden=true; sync(); scrollEnd();
      if(label==='기타' && a.choices.includes('기타')) setTimeout(()=>etc?.focus(),50);
      const followup=followupControls.find(({field})=>field.option===label);
      if(followup && a.choices.includes(label)) setTimeout(()=>{ followup.input.focus({preventScroll:true}); followup.wrap.scrollIntoView({block:'nearest', behavior:reduce?'auto':'smooth'}); },50);
    });
    chips.append(c);
  });
  if(all.includes('기타')){ etc=h('input',{type:'text', id:`q${i}-etc`, placeholder:q.etc}); etc.value=a.etc; etc.addEventListener('input',()=>{a.etc=etc.value; err.hidden=true;}); etc.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); send.click(); } }); }
  followupFields(q).forEach((field,index)=>{
    const inputId = index===0 ? `q${i}-followup` : `q${i}-followup-${index}`;
    const input = h('input',{type:'text', id:inputId, placeholder:field.placeholder || field.label, 'aria-label':field.label});
    input.value = followupValue(q,a,field);
    input.addEventListener('input',()=>{ if(field===q.followup) a.followup=input.value; else { a.followupDetails ||= {}; a.followupDetails[field.option]=input.value; } });
    input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); send.click(); } });
    const wrap = h('div',{class:'followup', id:`${inputId}-wrap`, hidden:true},
      h('label',{class:'lbl followup-label', for:inputId}, field.label), input);
    followupControls.push({field,input,wrap});
  });
  send.addEventListener('click',()=>{
    if(!a.choices.length) return;
    if(a.choices.includes('기타') && !a.etc.trim()){ err.textContent='기타 내용을 짧게 적어주세요.'; err.hidden=false; etc?.focus(); return; }
    submit(i);
  });
  trayInner.append(h('div',{class:'lbl'}, h('span',{}, multi?'답을 고른 뒤 보내기를 눌러주세요':'답을 하나 눌러주세요'), counter), chips);
  if(etc) trayInner.append(etc);
  followupControls.forEach(({field,wrap})=>{ const trigger=[...chips.querySelectorAll('.chip')].find(c=>c.dataset.v===field.option); chips.insertBefore(wrap, trigger?.nextSibling || null); });
  trayInner.append(err);
  if(multi || all.includes('기타')) trayInner.append(send);
  if(!multi && all.includes('기타')) send.hidden = true;
  const showSend = ()=>{ if(!multi) send.hidden = !a.choices.includes('기타'); };
  chips.addEventListener('click', showSend);
  sync(); showSend(); scrollEnd();
}

async function submit(i){
  if(busy) return; busy = true;
  const q=Q[i], a=ans[i];
  if(q.type!=='text' && a.choices.includes('기타') && !a.etc.trim()){ busy=false; return; }
  trayInner.innerHTML='';
  a.done = true;
  thread.append(myRow(i)); scrollEnd();
  updMeter();
  const r = thread.lastElementChild.getBoundingClientRect();
  burst(innerWidth-60, Math.max(80,r.top), 14);
  busy = false;
  const id = ++runId;
  const next = ans.findIndex(x=>!x.done);
  if(!await say(react(i), {delay:600}, id)) return;
  if(next>=0){
    if(i===Math.floor(N/2)-1 || (N<=4 && i===1)){ if(!await say(h('img',{src:EMO.party, class:'sticker', alt:'응원 이모티콘'}), {delay:400}, id)) return; if(!await say('벌써 절반 왔어요! 조금만 더 힘내요 💪', {delay:400}, id)) return; }
    ask(next);
  } else finishChat(id);
}

function rewind(i){
  if(submissionInFlight || submissionReceipt)return;
  runId++;
  for(let k=i;k<N;k++) ans[k].done=false;
  // rebuild thread up to i
  thread.innerHTML='';
  thread.append(h('div',{class:'day'}, '오늘'));
  thread.append(botRow(h('div',{class:'bub'}, '답변을 수정할게요. 해당 질문부터 다시 여쭤볼게요.')));
  for(let k=0;k<i;k++){ thread.append(botRow(questionBubble(Q[k],k))); thread.append(myRow(k)); }
  updMeter();
  ask(i);
}

async function finishChat(id){
  if(submissionInFlight)return;
  submissionInFlight=true;trayInner.innerHTML='';
  thread.querySelectorAll('.edit').forEach(button=>button.disabled=true);
  const answers={};
  Q.forEach((q,k)=>{ answers['q'+(k+1)] = q.type==='text' ? ans[k].text.trim() : {choices:ans[k].choices, etc:ans[k].etc.trim(), ...(q.followup ? {followup:ans[k].choices.includes(q.followup.option) ? ans[k].followup.trim() : ''} : {}), ...(q.followups ? {followupDetails:Object.fromEntries(q.followups.filter(field=>ans[k].choices.includes(field.option)).map(field=>[field.option,followupValue(q,ans[k],field).trim()]))} : {})}; });
  const pending=botRow(h('div',{class:'bub'},isCollectionPreview?'미리보기를 마무리하고 있어요…':'답변을 보내고 있어요…'));
  thread.append(pending);scrollEnd();
  let result;
  try{result=await save({answers,durationSec:Math.max(0,Math.round((Date.now()-startedAt)/1000))});}
  catch(error){result={ok:false,code:'TEMPORARY_ERROR'};}
  pending.remove();submissionInFlight=false;
  if(id!==runId)return;
  if(!result?.ok){
    if(result?.code==='ALREADY_SUBMITTED'){
      await say('이미 설문에 참여하셨어요. 소중한 의견 감사합니다.',{},id);return;
    }
    await say(result?.code==='INVALID_LINK'?'참여 링크를 확인해 주세요. 안내받으신 링크로 다시 접속해 주세요.':'답변을 아직 보내지 못했어요. 입력한 내용은 그대로 있으니 다시 보내주세요.',{},id);
    if(!['INVALID_LINK','VERSION_CHANGED','WRONG_SURVEY','INVALID_ANSWER'].includes(result?.code))trayInner.append(h('button',{class:'start',type:'button',onclick:()=>finishChat(++runId)},'다시 보내기'));
    return;
  }
  submissionReceipt=result.receipt || null;
  if(!result.preview)thread.querySelectorAll('.edit').forEach(button=>button.remove());
  else thread.querySelectorAll('.edit').forEach(button=>button.disabled=false);
  if(!await say('설문 완료! 소중한 의견 정말 고마워요 🎉', {delay:600}, id))return;
  burst(innerWidth/2, innerHeight/2, 70);
  const receipt=h('div',{class:'completion-attachment'}, buildReceipt(),
    h('p',{class:'r-tip'}, '접수증은 화면을 캡처해 두시면 나중에 확인하실 수 있어요.'));
  if(!await say(receipt, {delay:350}, id)) return;
  const ticket=buildGiftTicket();
  if(!await say(h('div',{class:'completion-attachment'}, ticket.section), {delay:350}, id)) return;
  requestAnimationFrame(()=>{ if(id!==runId) return; ticket.start(); scrollEnd(); });
}

// Public setting: Google Apps Script deployment URL. Contains no secret or account information.
const SURVEY_WEB_APP_URL = '';
const collectionSession = window.SURVEY_SESSION || null;
const isCollectionPreview = !collectionSession;
let submissionInFlight = false;
let submissionReceipt = null;
const submissionRequestId = crypto.randomUUID();
function collectionCall(method,payload){
  return new Promise((resolve,reject)=>{
    if(!window.google?.script?.run){reject(new Error('COLLECTION_UNAVAILABLE'));return;}
    const timer=setTimeout(()=>reject(new Error('COLLECTION_TIMEOUT')),25000);
    const runner=google.script.run.withSuccessHandler(result=>{clearTimeout(timer);resolve(result);}).withFailureHandler(()=>{clearTimeout(timer);reject(new Error('COLLECTION_UNAVAILABLE'));});
    if(method==='status')runner.getParticipation(payload);else runner.submitResponse(payload);
  });
}
function collectionNotice(message){
  trayInner.innerHTML='';thread.innerHTML='';
  thread.append(botRow(h('div',{class:'bub'},message)));scrollEnd();
}
async function startSurvey(){
  if(submissionInFlight)return;
  if(collectionSession){
    const button=trayInner.querySelector('.start');if(button)button.disabled=true;
    try{
      const status=await collectionCall('status',collectionSession.token);
      if(!status?.ok){collectionNotice(status?.code==='ALREADY_SUBMITTED'?'이미 설문에 참여하셨어요. 소중한 의견 감사합니다.':'전용 설문 링크를 확인해 주세요. 잠시 후 다시 접속하셔도 좋아요.');return;}
    }catch(error){if(button)button.disabled=false;await say('잠시 연결이 원활하지 않아요. 시작 버튼을 다시 눌러주세요.');return;}
  }
  startedAt=Date.now();ask(0);
}
async function initSurvey(){
  if(collectionSession){
    if(collectionSession.surveyKey!==SURVEY.key){collectionNotice('안내받으신 전용 설문 링크로 다시 접속해 주세요.');return;}
    return intro();
  }
  const hash=new URLSearchParams(location.hash.slice(1));
  const token=hash.get('t') || (/^[a-f0-9]{64}$/.test(location.hash.slice(1))?location.hash.slice(1):'');
  if(token){
    if(SURVEY_WEB_APP_URL){const target=new URL(SURVEY_WEB_APP_URL);target.searchParams.set('t',token);location.replace(target.href);return;}
    collectionNotice('설문 연결을 준비하고 있어요. 안내받으신 링크를 잠시 후 다시 열어주세요.');return;
  }
  const note=h('div',{class:'survey-preview-note'},'미리보기 · 실제 응답은 저장되지 않아요');
  document.querySelector('.top .inner').after(note);
  return intro();
}
async function save(record){
  if(isCollectionPreview)return {ok:true,preview:true};
  return collectionCall('submit',{
    token:collectionSession.token,requestId:submissionRequestId,surveyKey:SURVEY.key,
    schemaVersion:collectionSession.schemaVersion,answers:record.answers,durationSec:record.durationSec
  });
}


/* ---------- confetti ---------- */
const fx=$('#fx'), fctx=fx.getContext('2d'); let parts=[], raf=0;
function sizeFx(){ fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio; fctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
sizeFx(); addEventListener('resize',sizeFx);
function burst(x,y,n){ if(reduce) return; const cols=['#fee500','#1f9d63','#6b3f1f','#ff8a5b','#8fd3f4'];
  for(let k=0;k<n;k++) parts.push({x,y,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:Math.random()*6+4,c:cols[k%cols.length],r:Math.random()*6,life:70});
  if(!raf) loop(); }
function loop(){ fctx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;p.life--; fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.fillStyle=p.c;fctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);fctx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+20);
  raf = parts.length? requestAnimationFrame(loop) : (fctx.clearRect(0,0,innerWidth,innerHeight),0); }

/* ---------- scratch ticket ---------- */
function buildReceipt(){
  const now = new Date();
  const pad = n=>String(n).padStart(2,'0');
  const no = submissionReceipt?.receiptId || 'PREVIEW-'+Math.random().toString(36).slice(2,8).toUpperCase();
  const when = submissionReceipt?.submittedAt || '미리보기';
  const items = Q.map((q,k)=>{
    const a=ans[k];
    if(q.type==='text') return a.text.trim() ? {q:'추가 의견', v:'의견 남김'} : null;
    const v = a.choices.map(c=> c==='기타' ? `기타(${a.etc.trim()})` : (followupAnswer(q,a,c) ? `${c}: ${followupAnswer(q,a,c)}` : c));
    return {q:`Q${k+1}`, v:v.join(', ')};
  }).filter(Boolean);
  const receipt = h('div',{class:'receipt'},
    h('div',{class:'r-head'}, h('b',{}, '사장님 의견 접수증'), h('small',{}, '카카오톡 예약하기')),
    h('div',{class:'r-meta'}, h('span',{}, '접수번호'), h('span',{}, no), h('span',{}, '접수일시'), h('span',{}, when)),
    h('div',{class:'r-list'}, items.map(it=>h('div',{class:'r-item'}, h('span',{}, it.q), h('span',{}, it.v)))),
    h('div',{class:'r-foot'}, '보내주신 의견은 서비스 담당 팀이 하나하나 확인하고, 개선 과제를 정할 때 반영할게요.'),
    h('div',{class:'r-stamp'}, h('img',{src:EMO.party, alt:''}), h('span',{}, '접수 완료')));
  return receipt;
}

function buildGiftTicket(){
  const ticket=h('div',{class:'ticket'}, h('div',{class:'prize'}, h('div',{class:'win'},'당 첨'), h('img',{src:IMG, class:'prize-img', alt:PRIZE}), h('div',{class:'nm'}, PRIZE)));
  const cv=h('canvas',{class:'scr', 'aria-label':'복권 긁는 영역'}); ticket.append(cv);
  const after=h('div',{class:'after', hidden:true},
    h('img',{src:EMO.party, class:'sticker bounce', alt:''}),
    h('p',{}, h('b',{}, '축하해요! 당첨됐어요 🎉')),
    h('p',{}, '기프티콘은 파트너센터에 등록된 연락처로 순차 발송돼요. 소중한 의견 감사합니다.'));
  const reveal=h('button',{class:'ghost', type:'button'}, '긁기 어렵다면 여기를 눌러 한 번에 확인하기');
  const section=h('section',{class:'lucky'}, h('h2',{}, '행운의 복권'),
    h('p',{}, '어떤 선물이 나올까요? 손가락이나 마우스로 은박을 긁어보세요.'), ticket, after, reveal);
  const win=()=>{ after.hidden=false; reveal.hidden=true; const r=ticket.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, 90); };
  reveal.addEventListener('click',()=>{cv.style.opacity='0'; setTimeout(()=>cv.remove(),600); win();});
  return {section,start:()=>scratch(cv,win)};
}

function scratch(cv, onDone, cover={big:'오늘의 행운을\n열어보세요', small:''}){
  const r=cv.getBoundingClientRect(), dpr=devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.fillStyle='#f7df68'; ctx.fillRect(0,0,r.width,r.height);
  ctx.strokeStyle='#d4ba46'; ctx.lineWidth=1; ctx.setLineDash([3,5]);
  ctx.strokeRect(14,14,r.width-28,r.height-28); ctx.setLineDash([]);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#8d7939'; ctx.font='500 10px "Noto Sans KR", sans-serif';
  ctx.fillText('카카오톡 예약하기',r.width/2,40);
  const lines=(cover.big || '오늘의 행운을\n열어보세요').split('\n');
  const typeSize=Math.min(29,r.width*.098);
  ctx.fillStyle='#4b4528'; ctx.font=`800 ${typeSize}px "Noto Sans KR", sans-serif`;
  lines.forEach((line,i)=>ctx.fillText(line,r.width/2,r.height/2+(i-(lines.length-1)/2)*(typeSize+10)));
  ctx.fillStyle='#948044'; ctx.font='500 10px "Noto Sans KR", sans-serif';
  ctx.fillText(cover.small || '쓱쓱 긁어서 행운을 확인해 보세요',r.width/2,r.height-40);
  ctx.globalCompositeOperation='destination-out';
  let down=false, last=null, finished=false, moves=0;
  const pos=e=>{const b=cv.getBoundingClientRect(); return {x:e.clientX-b.left,y:e.clientY-b.top};};
  const draw=p=>{ctx.lineWidth=36;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo((last||p).x,(last||p).y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;};
  const check=()=>{ if(finished) return; const d=ctx.getImageData(0,0,cv.width,cv.height).data; let c=0,n=0; for(let k=3;k<d.length;k+=64){n++; if(d[k]===0)c++;} if(c/n>.5){finished=true; cv.style.opacity='0'; setTimeout(()=>cv.remove(),600); onDone();} };
  cv.addEventListener('pointerdown',e=>{down=true;last=null;cv.setPointerCapture(e.pointerId);draw(pos(e));});
  cv.addEventListener('pointermove',e=>{if(!down)return; draw(pos(e)); if(++moves%8===0) check();});
  const up=()=>{down=false;last=null;check();};
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
}

initSurvey();
</script>
